apiVersion: sdlc/v1
kind: Integration
metadata:
  id: github/integration.github-com
  version: 1.1.0
  summary: Pull requests on github.com, through its REST API
spec:
  type: sdlc/integration-type.source-control
  provider: github
  auth: { scheme: core/auth.bearer-token, credentials: { token: env:GITHUB_TOKEN } }
  settings:
    api: https://api.github.com
    # <owner>/<repo>, set by the project's binding.
    repository: ""
  operations:
    default-branch:
      steps:
        - as: repo
          request: { method: GET, url: "{{ settings.api }}/repos/{{ settings.repository }}", headers: { Accept: application/vnd.github+json, X-GitHub-Api-Version: "2022-11-28" } }
      result: { branch: "{{ repo.default_branch }}" }
    open-pull-request:
      steps:
        - as: pr
          request:
            method: POST
            url: "{{ settings.api }}/repos/{{ settings.repository }}/pulls"
            headers: { Accept: application/vnd.github+json, X-GitHub-Api-Version: "2022-11-28" }
            body: { title: "{{ input.title }}", head: "{{ input.source }}", base: "{{ input.target }}", body: "{{ has(input.body) ? input.body : '' }}" }
      result: { number: "{{ pr.number }}", url: "{{ pr.html_url }}", title: "{{ pr.title }}" }
    get-pull-request:
      steps:
        - as: pr
          request: { method: GET, url: "{{ settings.api }}/repos/{{ settings.repository }}/pulls/{{ input.number }}", headers: { Accept: application/vnd.github+json, X-GitHub-Api-Version: "2022-11-28" } }
          allow: [404]
      nothing: pr == null
      result:
        number: "{{ pr.number }}"
        url: "{{ pr.html_url }}"
        title: "{{ pr.title }}"
        # GitHub calls a merged pull request closed: merged_at says it was merged.
        state: "{{ pr.merged_at != null ? 'merged' : pr.state == 'closed' ? 'declined' : 'open' }}"
        source: "{{ pr.head.ref }}"
        target: "{{ pr.base.ref }}"
    # A review comment (on the diff) and a conversation comment are numbered apart: their ids say which.
    # Resolving a review thread is not in GitHub's REST API; this integration has no resolve.
    list-comments:
      steps:
        - as: review
          request: { method: GET, url: "{{ settings.api }}/repos/{{ settings.repository }}/pulls/{{ input.number }}/comments", query: { per_page: 100 }, headers: { Accept: application/vnd.github+json, X-GitHub-Api-Version: "2022-11-28" } }
          paginate: { style: page, items: page }
        - as: conversation
          request: { method: GET, url: "{{ settings.api }}/repos/{{ settings.repository }}/issues/{{ input.number }}/comments", query: { per_page: 100 }, headers: { Accept: application/vnd.github+json, X-GitHub-Api-Version: "2022-11-28" } }
          paginate: { style: page, items: page }
      result:
        comments: >-
          {{ review.map(c, {'id': 'review:' + string(c.id), 'body': c.body, 'parent': has(c.in_reply_to_id) && c.in_reply_to_id != null ? dyn('review:' + string(c.in_reply_to_id)) : null, 'file': c.path, 'resolved': false, 'task': false})
          + conversation.map(c, {'id': 'issue:' + string(c.id), 'body': c.body, 'parent': null, 'file': null, 'resolved': false, 'task': false}) }}
    changed-files:
      steps:
        - as: files
          request: { method: GET, url: "{{ settings.api }}/repos/{{ settings.repository }}/pulls/{{ input.number }}/files", query: { per_page: 100 }, headers: { Accept: application/vnd.github+json, X-GitHub-Api-Version: "2022-11-28" } }
          paginate: { style: page, items: page }
      result:
        files: "{{ files.map(f, {'path': f.filename, 'added': f.additions, 'removed': f.deletions}) }}"
    reply:
      steps:
        - as: threaded
          when: "has(input.parent) && input.parent.startsWith('review:')"
          request:
            method: POST
            url: "{{ settings.api }}/repos/{{ settings.repository }}/pulls/{{ input.number }}/comments/{{ input.parent.split(':')[1] }}/replies"
            headers: { Accept: application/vnd.github+json, X-GitHub-Api-Version: "2022-11-28" }
            body: { body: "{{ input.body }}" }
        # A conversation comment has no thread: the answer is a comment of the conversation.
        - as: conversation
          when: "!has(input.parent) || !input.parent.startsWith('review:')"
          request:
            method: POST
            url: "{{ settings.api }}/repos/{{ settings.repository }}/issues/{{ input.number }}/comments"
            headers: { Accept: application/vnd.github+json, X-GitHub-Api-Version: "2022-11-28" }
            body: { body: "{{ input.body }}" }
      result: { id: "{{ threaded != null ? 'review:' + string(threaded.id) : 'issue:' + string(conversation.id) }}" }
