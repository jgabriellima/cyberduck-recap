apiVersion: sdlc/v1
kind: Standard
metadata:
  id: cyberduck/standard.secrets-redacted-at-output
  version: 1.0.0
  summary: A secret the user supplies is redacted at one output point that every write passes
  description: >
    Learned in FEATURE-2. The verify.adversarial attacks on the topic "secrets on the command
    line" (insight score 36.7, the highest topic of the run) found a URL password that reached
    stdout or stderr at output sites that did not redact it: ATK-68, ATK-70, ATK-71, ATK-73 in
    test/adversarial/cli-url-password-redaction.test.ts, and ATK-74 (the host-key prompt, the
    known_hosts read and write errors, test/adversarial/cli-known-hosts-path-redaction.test.ts),
    which came back twice because each round redacted one more site. The class fix was one output
    point: redactingOutput (src/cli/redact.ts) wraps stdout and stderr in runCli. ATK-77
    (deferred, test/adversarial/cli-redaction-write-chunks.test.ts) shows the limit of that point:
    it redacts each write() on its own and only string chunks, so a line written in parts or as a
    Buffer passes unredacted; the rule therefore requires whole lines.
    Scope: the CLI and every later front end (UI, queue, sync logs) that prints text which can
    hold a secret. baseline/standard.no-secrets covers the source, tests and history; this
    standard covers what the program writes at run time.
    Enforcement: the review judges it, with no gate. test/cli/no-secret-leak.test.ts and the
    adversarial tests above check it for the paths they name; no lint rule can find a write that
    bypasses the output point.
spec:
  category: security
  statement: >-
    A secret the user supplies (a URL password, a typed or environment password or passphrase, a
    private key's text) never reaches stdout, stderr or a log: it is redacted at one output point
    that every write passes, never at each call site, and that point receives whole lines. A test
    with a sentinel secret covers each new output path, prompts and error lines included.
  applies_to: { kinds: [feature, bug, refinement, incident, chore] }
