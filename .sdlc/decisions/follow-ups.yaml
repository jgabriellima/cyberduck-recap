# Work the first runs deliver: the product and its scaffold are not decided by the specialization.
# RULE-20261027-014639 adds stream-open-single-source and malformed-parts-single-source: the copies
# cyberduck/standard.single-source finds on main. RULE-20261027-015151 adds comment-width-lint: the
# lint rule for cyberduck/standard.comment-width and the comment lines over 100 columns on main.
schema: sdlc.project-decisions.v1
topic: follow-ups
decisions:
  - id: scaffold
    subject: follow-ups.scaffold
    status: decided
    value:
      work: >-
        Scaffold the file-transfer client in TypeScript with pnpm (the owner's choice; toolchain sdlc/toolchain.node-pnpm): create package.json, pnpm-lock.yaml, tsconfig.json, the ESLint and Prettier configurations and the Vitest setup, so the preset's tools (build, lint, typecheck, format-check, unit-tests, audit) run green. The linter and formatter exclude .claude/, .agent/, .outputs/ and .sdlc/. Until the scaffold lands, the sdlc/baseline gates over those tools cannot hold.
      open_questions:
        - Desktop UI toolkit (e.g. Electron, Tauri), CLI, or both; target platforms and packaging/distribution.
        - Runtime and framework within TypeScript (Node version, bundler, monorepo or single package).
        - Protocol libraries for SFTP, S3, WebDAV and the other back-ends ("SFTP/S3/WebDAV, etc." in the objective).
        - Where saved credentials live (OS keychain or otherwise) and how host keys and TLS are verified.
        - How Cyberduck is studied as the model (behaviour reference only; its licence governs any reuse).
    rationale: "Discovery found an empty repository; the owner chose TypeScript + pnpm, the rest of the product's stack is the scaffold's to decide."
    provenance:
      kind: asked
      question: "Which language and package manager does the project use? The baseline's checks need a toolchain, and the repository has none yet."
      answer: TypeScript + pnpm
  - id: product-requirements
    subject: follow-ups.product
    status: decided
    value:
      work: >-
        Turn the objective into work items (/sdlc-goal): "Build a new file-transfer client (SFTP/S3/WebDAV, etc.) modeled on Cyberduck" — which protocols first, browsing, upload and download, bookmarks, transfer queue, synchronisation.
    rationale: "Product requirements are the work items' to decide, not the specialization's."
    provenance:
      kind: asked
      question: What is the project's objective?
      answer: Build a new file-transfer client (SFTP/S3/WebDAV, etc.) modeled on Cyberduck
  - id: github-work-items
    subject: follow-ups.integrations.work_items
    status: decided
    value:
      work: >-
        Work items on GitHub Issues for jgabriellima/cyberduck-recap. The github/cloud package serves source control only (pull requests); no installed package serves GitHub Issues, so work items stay local (specs in the repository) until a GitHub Issues integration is added with /sdlc-evolve.
    rationale: "The owner chose GitHub; the github/cloud package covers source control only."
    provenance:
      kind: asked
      question: "Where does the work live: source control, work items and CI?"
      answer: https://github.com/jgabriellima/cyberduck-recap.git
  - id: github-actions-ci
    subject: follow-ups.integrations.ci
    status: decided
    value:
      work: >-
        CI on GitHub Actions. The github/cloud package has no CI integration, so checks run locally through the engine's gates; once the scaffold has a toolchain, add a GitHub Actions workflow and a CI integration with /sdlc-evolve.
    rationale: "The owner chose GitHub; the github/cloud package has no CI operations."
    provenance:
      kind: asked
      question: "Where does the work live: source control, work items and CI?"
      answer: https://github.com/jgabriellima/cyberduck-recap.git
  - id: remote
    subject: follow-ups.source_control.remote
    status: decided
    value:
      work: >-
        The repository has no remote yet: add origin https://github.com/jgabriellima/cyberduck-recap.git before the first pull request. GITHUB_TOKEN (contents and pull-request write access to that repository) is in the git-ignored .env.local, where the engine reads it.
    rationale: "Discovery found no remote; the GitHub integration needs one and a token."
    provenance:
      kind: asked
      question: "Where does the work live: source control, work items and CI?"
      answer: https://github.com/jgabriellima/cyberduck-recap.git
  - id: sanitise-format-characters
    subject: follow-ups.security.sanitise-format-characters
    status: decided
    value:
      work: >-
        Bring sanitizeServerText (src/sftp/sanitize.ts) in line with cyberduck/standard.sanitised-server-text: it escapes C0/C1 controls and DEL (/[\u0000-\u001f\u007f-\u009f]/) but not the bidi overrides U+202A-U+202E, U+2066-U+2069 or the separators U+2028/U+2029. Add a test for each range. A bug work item, delivered with /sdlc-deliver.
    rationale: "The standard binds every change from its approval; the code FEATURE-1 left does not meet it yet, as FEATURE-1's code review found."
    provenance:
      kind: extracted
      evidence:
        - command: grep -n 'CONTROL_CHARACTERS =' src/sftp/sanitize.ts
          output: "5:const CONTROL_CHARACTERS = /[\\u0000-\\u001f\\u007f-\\u009f]/g;"
  - id: stream-open-single-source
    subject: follow-ups.code.stream-open-single-source
    status: decided
    value:
      work: >-
        Bring src/sftp/streams.ts in line with cyberduck/standard.single-source: SftpReadStream._construct and SftpWriteStream._construct hold the same OPEN logic (session check, settleOnce, track/abort, request, late-handle close, malformed handle, explainFailure) and differ only in the open flag 'r' or 'w'. Move it to one shared helper that both call. The tests under test/sftp/ and test/adversarial/ (open-teardown, settle-once, stream-session-ending) keep passing. A refinement work item, delivered with /sdlc-deliver.
    rationale: "The standard binds every change from its approval; BUG-2's review found this copy on main."
    provenance:
      kind: extracted
      evidence:
        - command: grep -n "override _construct\|sftp.open(this.#context.path" src/sftp/streams.ts
          output: "90: override _construct (SftpReadStream); 107: sftp.open(..., 'r', done); 298: override _construct (SftpWriteStream); 315: sftp.open(..., 'w', done)"
  - id: malformed-parts-single-source
    subject: follow-ups.code.malformed-parts-single-source
    status: decided
    value:
      work: >-
        Bring src/sftp/error-map.ts in line with cyberduck/standard.single-source: MALFORMED_PARTS ('file handle', 'directory handle', 'directory entries', 'attributes', 'data') is copied by hand from the part names that src/sftp/connection.ts passes to expecting() and MalformedReplyError. Declare the part names once as a constant that both files import or derive from. A refinement work item, delivered with /sdlc-deliver.
    rationale: "The standard binds every change from its approval; BUG-2's review found this copy on main."
    provenance:
      kind: extracted
      evidence:
        - command: grep -n "const MALFORMED_PARTS" src/sftp/error-map.ts
          output: "59:const MALFORMED_PARTS: ReadonlySet<string> = new Set(["
        - command: grep -n "expecting('" src/sftp/connection.ts
          output: "160: 'file handle'; 180: 'directory handle'; 187: 'directory entries'; 190, 192: 'attributes'"
  - id: comment-width-lint
    subject: follow-ups.code.comment-width-lint
    status: decided
    value:
      work: >-
        Make baseline/gate.lint check cyberduck/standard.comment-width. In eslint.config.js, after the prettier entry (eslint-config-prettier turns max-len off, so an earlier entry has no effect), add for src/**/*.ts and test/**/*.ts: 'max-len': ['error', { code: <no limit, e.g. 10000>, comments: 100 }]. ESLint 10.13.0 keeps the core rule until 11.0.0; @stylistic/max-len replaces it then (a new dev dependency). Wrap the 10 comment lines over 100 columns on main: src/fs/errors.ts:47, src/sftp/algorithms.ts:1, src/sftp/error-map.ts:201, src/sftp/known-hosts.ts:25, src/sftp/operations.ts:190, test/adversarial/sanitize-format-characters.test.ts:488, test/adversarial/sanitize-text-coercion.test.ts:6 and :136, test/sftp/error-map.test.ts:173, test/support/hostile-sftp-server.ts:21 (two are eslint-disable directives: shorten the reason after "--"). pnpm lint then exits 0. A chore work item, delivered with /sdlc-chore. After it merges, a rule or evolve run adds enforced_by { gate: baseline/gate.lint, at: implement } to the standard; until then the review judges it.
      open_questions:
        - >-
          The person's rule calls 100 columns "the formatter's line width", but .prettierrc.json sets no printWidth, so Prettier formats code at 80. Set "printWidth": 100 in .prettierrc.json (pnpm format then rewraps code across src/ and test/) or keep 80 for code and 100 for comments?
    rationale: "The standard binds every change from its approval; no lint rule checks comment width yet, and 10 comment lines on main are over 100 columns."
    provenance:
      kind: extracted
      evidence:
        - command: cat .prettierrc.json
          output: '{ "singleQuote": true }'
        - command: grep -n "max-len" eslint.config.js
          output: "(no match)"
        - command: "pnpm exec eslint (probe config: max-len { code: 10000, comments: 100 }) src test"
          output: "10 max-len errors: src/fs/errors.ts:47 (102), src/sftp/algorithms.ts:1 (101), src/sftp/error-map.ts:201 (121), src/sftp/known-hosts.ts:25 (103), src/sftp/operations.ts:190 (101), test/adversarial/sanitize-format-characters.test.ts:488 (109), test/adversarial/sanitize-text-coercion.test.ts:6 (101), :136 (106), test/sftp/error-map.test.ts:173 (104), test/support/hostile-sftp-server.ts:21 (101)"
