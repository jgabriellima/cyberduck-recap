# The Definition of Done areas sdlc/baseline does not cover.
# RULE-20261027-013133: architecture is kept by standards (cyberduck/standard.protocol-boundaries,
# cyberduck/standard.session-ending-settles-once), so it needs no conventions decision. The earlier
# conventions/architecture record decided conventions.architecture a second time against the
# interview's answer, and `sdlc-engine proposal check` refuses a subject decided twice with
# different values. Integration and review record the interview's answer as given:
# "default (baseline)". Both "baseline" and "none" settle a category with no rule of its own.
schema: sdlc.project-decisions.v1
topic: conventions
decisions:
  - id: architecture
    subject: conventions.architecture
    status: decided
    value: cyberduck/standard.protocol-boundaries
    rationale: >-
      FEATURE-1's ticket keeps the CLI, queue, sync and UI independent of any protocol, and its boundary tests (test/fs/boundary.test.ts, test/boundary/ssh2-imports.test.ts) enforce it.
    provenance:
      kind: extracted
      evidence:
        - command: grep -n 'must not depend on a specific protocol' .outputs/work/FEATURE-1/spec.md
          output: "31:> operations, and the CLI, queue, sync and UI must not depend on a specific protocol."
        - command: pnpm exec vitest run test/fs/boundary.test.ts test/boundary/ssh2-imports.test.ts
          output: "Test Files 2 passed (2); Tests 5 passed (5)"
  - id: integration
    subject: conventions.integration
    status: decided
    value: baseline
    provenance:
      kind: asked
      question: "Integration: how changes land: anything beyond one pull request per change with checks green (commit format, release notes, changelog), or none?"
      answer: default (baseline)
  - id: review
    subject: conventions.review
    status: decided
    value: baseline
    provenance:
      kind: asked
      question: "Review: beyond the agent review panel and your approval at the gates, must a person review every pull request before merge, or anything else, or none?"
      answer: default (baseline)
